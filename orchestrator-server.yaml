  - url: '{{ _.stage_orch_base_url }}/api/test-scenario/{% prompt ''Scenario ID'', ''myScenarioId'', ''Scenario ID'', '''', ''myScenarioId'' %}/messages'
    name: GET /api/test-scenario/{testScenarioId}/messages — 테스트 시나리오 채팅 조회
    meta:
      id: req_orch_scenario_messages
      created: 1784859824000
      modified: 1784859824000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: 해당 시나리오 저작 세션의 채팅 스레드를 조회한다.


        **Request**

