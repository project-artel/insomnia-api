- name: QA Run (실행)
  meta:
    id: fld_orch_qarun
    created: 1786200000000
    modified: 1786200000000
  children:
  - url: '{{ _.stage_orch_base_url }}/api/qa-runs'
    name: POST /api/qa-runs — QA 런 실행 시작
    meta:
      id: req_orch_qarun_create
      created: 1786200000000
      modified: 1786200000000
      isPrivate: false
      description: |-
        **호출 주체**: FE → Orchestration

        **동작**: 테스트 런(TR) 하나를 QA 실행한다. 한 Agent 세션이 런의 시나리오들을 순차 실행하고 사이에 게임을 초기화한다. 부모 qa_run + 시나리오당 qa_try(PENDING)를 적재하고 첫 시나리오를 활성화한다. (ARTEL-259, PR #93)

        **Request**
        - `{ testRunId, gameInstanceId, model?, language?, promptVersion?, reasoning?, arch? }` (id는 문자열)

        **Response**
        - `201`: QaRunResponse (id, status, tries[])
        - `401`: 미인증
        - `404`: 런·인스턴스·시나리오 미존재/비참여
        - `409`: 활성 런 존재 / SDK 미연결 / 실행할 시나리오 없음

        **규칙**: 인스턴스당 활성 런 1개 → 시나리오 순차 실행 보장.
    method: POST
    body:
      mimeType: application/json
      text: '{"testRunId": "1", "gameInstanceId": "1", "model": "anthropic/claude-sonnet-5", "language": "ko", "promptVersion": "v8"}'
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/qa-runs/{% prompt ''QA Run ID'', ''myQaRunId'', ''QA Run ID'', '''', ''1'' %}'
    name: GET /api/qa-runs/{id} — QA 런 조회
    meta:
      id: req_orch_qarun_get
      created: 1786200000000
      modified: 1786200000000
      isPrivate: false
      description: |-
        **호출 주체**: FE 런 화면 → Orchestration (종단까지 폴링)

        **동작**: 런 하나 + 시나리오별 qa_try 상태 개요. 시나리오별 실시간 상세는 qa_try SSE(`/api/qa-tries/{id}/events`). (ARTEL-259, PR #93)

        **Request**
        - `id` (path)

        **Response**
        - `200`: QaRunResponse (status, startedAt, completedAt, tries[])
        - `401`: 미인증
        - `404`: 비멤버/미존재
    method: GET
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/qa-runs/{% prompt ''QA Run ID'', ''myQaRunId'', ''QA Run ID'', '''', ''1'' %}/cancel'
    name: POST /api/qa-runs/{id}/cancel — QA 런 실행 취소
    meta:
      id: req_orch_qarun_cancel
      created: 1786200000000
      modified: 1786200000000
      isPrivate: false
      description: |-
        **호출 주체**: FE(런 종료) → Orchestration

        **동작**: 런 전체 취소. 활성 시나리오는 Agent 세션 종료까지 취소하고, 미종단 try를 정리한 뒤 qa_run을 CANCELLED로 닫아 게임 인스턴스를 해제한다. 이 경로가 없으면 스테일 런이 인스턴스를 영구 점유해 재실행이 막힌다. (ARTEL-259 런 라이프사이클, PR #93)

        **Request**
        - `id` (path)

        **Response**
        - `204`: 취소 완료
        - `401`: 미인증
        - `404`: 비멤버/미존재
        - `409`: 이미 종료된 런
    method: POST
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
- name: Knowledge
  meta:
    id: fld_orch_knowledge
    created: 1784859807000
    modified: 1784859807000
  children:
  - url: '{{ _.stage_orch_internal_base_url }}/internal/knowledge'
    name: GET /internal/knowledge — 게임 지식(knowledge) 조회 (내부 포트)
    meta:
      id: req_orch_knowledge_query
      created: 1784859901000
      modified: 1784859901000
      isPrivate: false
      description: |-
        **호출 주체**: Agent/내부 도구 → Orchestration (서버-투-서버, 무인증)

        **⚠️ 내부 포트로 간다**(`stage_orch_internal_base_url`, 기본 8081). 공개 포트로 부르면 404다.

        **동작**: reference_context를 대체한 통합 지식창고 `knowledge`를 조회한다. 프로젝트 스코프에서 `source`/`tag`로 필터한다. 시나리오 작성·QA·보고서·Issue 작성 Agent가 소비한다.

        **운영 지식창고만 보여 준다**(ARTEL-256). 실험 스코프(arm)는 이 엔드포인트로 보이지 않는다.

        **Request**
        - `projectId` (query, 필수)
        - `source` (query, 선택): DOCS | QA (대소문자 무시)
        - `tag` (query, 선택): CONTROL | RULE | OBJECTIVE | UI | MISC (대소문자 무시)

        **Response**
        - `200`: `{ items: [ { id, projectId, source, sourceId, contentHash, tag, summary, description, createdAt } ] }` (id 계열은 문자열)
        - `400`: 제공했으나 잘못된 `source`/`tag` 값

        **활용**: Agent가 필요한 성질(tag)·출처(source)만 뽑아 참고한다. 적재는 DOCS=업로드→Agent `/internal/extract`, QA=QA 세션 WS(`KNOWLEDGE_CREATE`).
    method: GET
    parameters:
    - name: projectId
      value: '1'
    - name: source
      value: DOCS
    - name: tag
      value: CONTROL
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
- name: LLM Usage
  meta:
    id: fld_orch_llm_usage
    created: 1786060800000
    modified: 1786060800000
  children:
  - url: '{{ _.stage_orch_internal_base_url }}/internal/llm-usage'
    name: POST /internal/llm-usage — LLM 사용량 수집 (내부 포트)
    meta:
      id: req_orch_llm_usage_record
      created: 1786060800000
      modified: 1786060800000
      isPrivate: false
      description: |-
        **호출 주체**: Agent 서버 → Orchestration (서버-투-서버, 무인증). ARTEL-233/234, 경로 변경은 ARTEL-267.

        **⚠️ 내부 포트로 간다**(`stage_orch_internal_base_url`, 기본 8081). 공개 포트로 부르면 404다.

        **동작**: Agent가 모은 LLM 호출 사용량 배치를 적재한다. 응답 본문이 없다 — 보내는 쪽은 결과를 보지 않고 재시도도 하지 않으므로 204면 충분하다.

        **Request**
        - `records` (object[], 필수, 1–200건): 상한 200은 Agent 쪽 전송 배치 크기와 맞춘 계약값이다. 넘치면 Agent가 나눠 보낸다. **빈 배열은 400** — 호출이 없었다면 요청 자체가 없어야 한다
        - `records[].service` (enum, 필수): `QA_RUN` | `SCENARIO` | `KNOWLEDGE_QUERY` | `GAME_CONTEXT` | `EMBEDDING`
        - `records[].referenceId` (number, 선택): `service`가 가리키는 테이블의 id. FK가 아니고 null이어도 저장된다 — Agent가 어떤 프로젝트/실행의 호출인지 모르는 경로가 있고, 그 경우 지출만 남는다
        - `records[].provider` (string, 필수, ≤40) / `model` (string, 필수, ≤80)
        - `records[].inputTokens`, `outputTokens`, `cachedInputTokens`, `reasoningTokens`, `latencyMs` (number, 0 이상). `EMBEDDING`의 `outputTokens`는 항상 0이다(임베딩은 토큰을 생성하지 않는다)
        - `records[].costUsd` (number, 선택): provider가 단가를 알려주지 않으면 없다
        - `records[].calledAt` (string, 필수): Agent가 provider를 실제로 호출한 시각(ISO-8601 UTC). 집계 기준 시각이다

        **Response**
        - `204`: 본문 없음
        - `400`: 배치 크기 위반 또는 필드 검증 실패(`service` 오타 포함 — DB CHECK까지 가지 않고 파싱 단계에서 떨어진다)

        **활용**: 손으로 시험할 때 `calledAt`을 과거로 두면 그 시각 버킷에 집계된다. 재전송은 중복 적재이므로 같은 배치를 두 번 보내지 않는다.
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "records": [
            {
              "service": "QA_RUN",
              "referenceId": 1,
              "provider": "openrouter",
              "model": "openai/gpt-4o-mini",
              "inputTokens": 1820,
              "outputTokens": 240,
              "cachedInputTokens": 0,
              "reasoningTokens": 0,
              "costUsd": 0.00042,
              "latencyMs": 1350,
              "calledAt": "2026-08-07T00:00:00Z"
            },
            {
              "service": "EMBEDDING",
              "referenceId": null,
              "provider": "openrouter",
              "model": "openai/text-embedding-3-small",
              "inputTokens": 512,
              "outputTokens": 0,
              "cachedInputTokens": 0,
              "reasoningTokens": 0,
              "latencyMs": 210,
              "calledAt": "2026-08-07T00:00:05Z"
            }
          ]
        }
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: none
