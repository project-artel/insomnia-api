type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: orchestrator-server
meta:
  id: wrk_orch_artel_api_collection
  created: 1784859800000
  modified: 1784859800000
  description: >-
    Artel Orchestration Server API — 인증, 프로젝트, 기획서, 게임빌드·인스턴스, SDK·Agent·TestScenario.
    환경: Base Environment는 stage(https://stage-api.artel.kr). stage_orch_base_url 변수 사용.
collection:
  - url: "{{ _.stage_orch_base_url }}/oauth2/authorization/github"
    name: OAuth 로그인 시작
    meta:
      id: req_orch_oauth_start
      created: 1784859801000
      modified: 1784859801000
      isPrivate: false
      description: GitHub OAuth 로그인 시작. 브라우저 리다이렉트.
    method: GET
    settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
  - url: "{{ _.stage_orch_base_url }}/login/oauth2/code/github"
    name: OAuth 콜백
    meta:
      id: req_orch_oauth_callback
      created: 1784859802000
      modified: 1784859802000
      isPrivate: false
      description: GitHub OAuth 콜백. code·state 쿼리 파라미터로 JWT 교환.
    method: GET
    settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
  - url: "{{ _.stage_orch_base_url }}/api/auth/me"
    name: 내 정보
    meta:
      id: req_orch_auth_me
      created: 1784859803000
      modified: 1784859803000
      isPrivate: false
      description: 현재 JWT 사용자 정보. 401 Unauthorized 가능.
    method: GET
    settings: { renderRequestBody: true, encodeUrl: true, followRedirects: global, cookies: { send: true, store: true }, rebuildPath: true }
    authentication:
      type: bearer
      token: "{{ _.stage_orch_jwt }}"
  - url: "{{ _.stage_orch_base_url }}/api/auth/logout"
    name: 로그아웃
