    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/test-scenario/{% prompt ''Scenario ID'', ''myScenarioId'', ''Scenario ID'', '''', ''myScenarioId'' %}/cases'
    name: PUT /api/test-scenario/{testScenarioId}/cases — 시나리오 케이스 조합 저장(전체 교체)
    meta:
      id: req_orch_scenario_cases_set
      created: 1784860002000
      modified: 1784860002000
      isPrivate: false
      description: |-
        **호출 주체**: FE 캔버스(드래그앤드롭) → Orchestration

        **동작**: 시나리오의 케이스 조합을 통째로 교체한다. `caseIds`의 순서가 곧 position이다.

        **Request**
