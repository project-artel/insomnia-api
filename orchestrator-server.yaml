      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/test-scenario/{% prompt ''Scenario ID'', ''myScenarioId'', ''Scenario ID'', '''', ''myScenarioId'' %}/message'
    name: POST /api/test-scenario/{testScenarioId}/message — 테스트 시나리오 메시지 전송
    meta:
      id: req_orch_scenario_message_send
      created: 1784859825000
      modified: 1784859825000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: 저작 챗봇에 사용자 메시지를 보낸다. Orchestration이 Agent WS로 전달하고, 응답은 SSE로 스트리밍된다.


        **Request**

        - `testScenarioId` (path)

        - `{ content }`


        **Response**

        - `200`: 접수됨(본문은 SSE로 수신)


        **활용**: 전송 전 SSE(`/stream`)를 먼저 구독해 응답 토큰을 받는다.'
    method: POST
    body:
      mimeType: application/json
      text: '{"type": "user_input", "testScenarioMessage": "1단계를 더 자세히 설명해줘"}'
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/test-scenario/{% prompt ''Scenario ID'', ''myScenarioId'', ''Scenario ID'', '''', ''myScenarioId'' %}/stream'
    name: GET /api/test-scenario/{testScenarioId}/stream — 테스트 시나리오 SSE 구독
    meta:
      id: req_orch_scenario_sse
      created: 1784859826000
      modified: 1784859826000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: `text/event-stream`으로 저작 세션 이벤트(챗봇 응답 토큰, 상태, close)를 스트리밍한다. Agent WS→Orchestration Sink→FE로 흐른다.


        **Request**

        - `testScenarioId` (path)

        - `Accept: text/event-stream`


        **Response**

        - `200`: SSE 스트림(승인/종료 시 closed 이벤트 후 종료)'
    method: GET
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/test-scenario/{% prompt ''Scenario ID'', ''myScenarioId'', ''Scenario ID'', '''', ''myScenarioId'' %}'
    name: PUT /api/test-scenario/{testScenarioId} — 테스트 시나리오 자동저장(canvas 편집)
    meta:
      id: req_orch_scenario_update
      created: 1784859827000
      modified: 1784859827000
      isPrivate: false
      description: '**호출 주체**: FE canvas(드래그·편집) → Orchestration


        **동작**: 사용자가 편집 중인 draft를 저장한다. FE는 debounce(마이크로 배치)로 이 PUT을 호출해 편집 상태를 서버와 맞춘다(R2DBC 저장).


        **Request**

        - `testScenarioId` (path)

        - `{ draft: ScenarioDraft }`


        **Response**

        - `200`: 저장 완료

        - `404`: 비참여자/미존재'
    method: PUT
    body:
      mimeType: application/json
      text: "{\n  \"draft\": {\n    \"title\": \"튜토리얼 진행 검증\",\n    \"description\": \"메인→인게임\",\n    \"steps\": [\n      {\"step\": 1, \"title\": \"게임 시작\", \"state\": \"메인 메뉴\", \"action\": \"시작 버튼 클릭\", \"expected\": \"인게임 진입\"}\n    ]\n  }\n}"
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/test-scenario/{% prompt ''Scenario ID'', ''myScenarioId'', ''Scenario ID'', '''', ''myScenarioId'' %}/approve'
    name: POST /api/test-scenario/{testScenarioId}/approve — 테스트 시나리오 승인(확정)
    meta:
      id: req_orch_scenario_approve
      created: 1784859828000
      modified: 1784859828000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: 편집을 마치고 시나리오를 확정한다. body의 draft(있으면)를 최종 payload로 저장하고, Agent WS로 `{type:close}`를 보내 세션을 종료하며 FE SSE도 닫는다. 채팅·시나리오는 남는다.


        **Request**

        - `testScenarioId` (path)

        - `{ draft?: ScenarioDraft }`


        **Response**

        - `200`: 승인 완료

        - `404`: 비참여자/미존재'
    method: POST
    body:
      mimeType: application/json
      text: "{\n  \"draft\": {\n    \"title\": \"최종본\",\n    \"description\": \"확정된 시나리오\",\n    \"steps\": [\n      {\"step\": 1, \"title\": \"게임 시작\", \"state\": \"메인 메뉴\", \"action\": \"시작 버튼 클릭\", \"expected\": \"인게임 진입\"}\n    ]\n  }\n}"
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/projects/{% prompt ''Project ID'', ''myProjectId'', ''Project ID'', '''', ''1'' %}/test-scenario'
    name: GET /api/projects/{projectId}/test-scenario — 프로젝트 시나리오 목록 조회
    meta:
      id: req_orch_scenario_list
