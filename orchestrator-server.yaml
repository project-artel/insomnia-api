        - `{ caseIds: string[] }` — 케이스 id 배열(순서=position)

        **Response**
        - `200`: 저장 후의 조합(조회와 동일한 형태)
        - `400`: `caseIds`에 숫자가 아닌 값
        - `404`: 비참여자/미존재

        **활용**: 드래그앤드롭 재정렬/추가/삭제 결과를 저장한다(전체 교체 방식).
    method: PUT
    body:
      mimeType: application/json
      text: '{"caseIds": ["1", "2", "3"]}'
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/test-scenario/{% prompt ''Scenario ID'', ''myScenarioId'', ''Scenario ID'', '''', ''myScenarioId'' %}'
    name: DELETE /api/test-scenario/{testScenarioId} — 테스트 시나리오 삭제
    meta:
      id: req_orch_scenario_delete
      created: 1784859835000
      modified: 1784859835000
      isPrivate: false
      description: |-
        **호출 주체**: FE → Orchestration

        **동작**: 시나리오와 그 조합 링크(test_scenario_case·test_run_scenario)를 삭제한다. **재사용 케이스(TestCase)와 런 본체는 삭제하지 않고** 조인 링크만 정리한다. 삭제는 사용자 수동 조작이며 저작 챗봇은 자동으로 삭제하지 않는다. (ARTEL-207, PR #91)

        **Request**
        - `testScenarioId` (path)
        - `force` (query, Boolean, 기본 false): QA 실행 이력이 있어도 강제 삭제

        **동작 규칙**
        - 실행 이력(qa_try) 없음 → 삭제(204)
        - 실행 이력 있음 + `force=false` → **409 `scenario_has_qa_history`** (실행 기록·발견 이슈 보호)
        - 실행 이력 있음 + `force=true` → qa_try(+qa_log·issue CASCADE)까지 삭제 후 본체 삭제(204)

        **Response**
        - `204`: 삭제 완료(본문 없음)
        - `401`: 미인증
        - `404`: 비참여자/미존재
        - `409`: `scenario_has_qa_history` — 실행 이력 존재(force로 재시도)
    method: DELETE
    parameters:
    - name: force
      value: 'false'
      disabled: true
      description: 실행 이력이 있어도 강제 삭제(true면 qa_try까지 함께 삭제)
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
