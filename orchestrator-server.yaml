    name: POST /internal/test-case-spec/{projectId} — Agent 명세 CSV 수신 (내부 포트)
    meta:
      id: req_orch_testcase_spec_ingest
      created: 1785400000000
      modified: 1785400000000
      isPrivate: false
      description: |-
        **호출 주체**: Agent 서버 → Orchestration (서버-투-서버, 무인증 — 토큰 없음)

        **⚠️ 내부 포트로 간다**(`stage_orch_internal_base_url`, 기본 8081). 바로 아래 `GET /api/projects/{projectId}/test-case-spec/download`와 이름이 겹치지만 **다른 포트, 다른 신뢰 경계**다 — 그쪽은 공개 포트의 인증된 사용자 경로이고 이쪽은 무인증 서버-투-서버 경로다. 이 요청이 404면 base URL 변수부터 본다.

        **동작**: 사용자가 SDK를 등록하는 시점에 Agent가 만든 기능 테스트 명세 CSV를 받아 두 가지를 한 흐름에서 처리한다. ①행을 `test_case`로 적재하고 ②같은 표를 XLSX로 변환해 S3에 저장한다(사용자가 대시보드에서 내려받는 산출물).

        순서는 검증 → 변환 → DB 커밋 → S3 저장이다. S3가 마지막이라 앞 단계가 실패하면 버킷에 고아 파일이 남지 않는다.

        **Request**
        - `projectId` (path)
        - 본문: **CSV 원문 바이트** (`text/csv`). multipart 아님 — Insomnia에서는 Body를 `Other` → `text/csv`로 두고 CSV를 그대로 붙여넣는다(`File` 선택 시 `application/octet-stream`도 허용).
        - 열 이름은 대소문자·공백·언더스코어를 무시하고 인식한다(`Test Case` = `test_case`).
        - 필수 열: 제목(`title`/`제목`), 기대결과(`expected`/`기대결과`)
        - 선택 열: 분류(`category`/`분류`, 없으면 `미분류`), 사전조건(`precondition`/`사전조건`)
        - 최대 5,000행(`CsvReader.MAX_ROWS`)

        **Response**
        - `200`: `{ totalRows, created, updated, skipped }`
        - `400`: CSV가 아님 / 필수 열 미인식 / 본문 비어 있음 / 행 수 상한 초과 — 이 경우 DB·S3 **어느 쪽에도 남지 않는다**
        - `404`: 없거나 삭제된 프로젝트

        **활용**: 적재는 `title` + `category` 기준 **upsert**다. SDK 재등록마다 같은 명세가 다시 오므로 재전송해도 중복이 쌓이지 않는다(두 번째 호출은 `created: 0`). 이미 있는 케이스는 내용만 갱신하고 `verificationStatus`·`lastVerifiedBuildId`는 보존한다 — 그 값은 CSV가 아니라 QA 런이 만든 결과라 덮으면 검증 이력이 사라진다.
    method: POST
    body:
      mimeType: text/csv
      text: |-
        category,title,precondition,expected
        전투,평타 공격,적이 사거리 안,적 HP 감소
        전투,스킬 사용,마나 30 이상,마나 차감 + 스킬 발동
        상점,상점 입장,로비에 있음,상점 UI 노출
        상점,아이템 구매,골드 100 이상,골드 차감 + 인벤토리 추가
        인벤토리,아이템 장착,아이템 보유,캐릭터 스탯 상승
    headers:
    - name: Content-Type
      value: text/csv
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: none
  - url: '{{ _.stage_orch_base_url }}/api/projects/{% prompt ''Project ID'', ''myProjectId'', ''Project ID'', '''', ''1'' %}/test-case-spec/download'
    name: GET /api/projects/{projectId}/test-case-spec/download — 명세 XLSX 다운로드 티켓
    meta:
      id: req_orch_testcase_spec_download
      created: 1785400001000
      modified: 1785400001000
      isPrivate: false
      description: |-
        **호출 주체**: FE 대시보드(React) → Orchestration

        **동작**: Agent가 보낸 명세를 XLSX로 변환해 둔 산출물의 **단기 서명 URL**을 발급한다. 파일 바이트를 이 서버가 중계하지 않고 S3가 직접 내려준다(기획서 다운로드와 같은 방식). URL은 요청할 때마다 새로 만든다 — 오래 사는 링크를 화면에 박아두지 않기 위해서다.

        **Request**
        - `projectId` (path)

        **Response**
        - `200`: `{ downloadUrl, expiresAt }`
        - `404`: 비참여자 / 아직 받은 명세가 없음

        **활용**: `downloadUrl`을 그대로 열면 `테스트케이스명세.xlsx`로 저장된다(`Content-Disposition`에 RFC 5987 파일명과 ASCII 폴백을 함께 싣는다). 산출물은 프로젝트당 한 벌이며 명세가 다시 오면 덮어쓴다.
    method: GET
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
