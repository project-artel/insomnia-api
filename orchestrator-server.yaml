    name: GET /api/projects/{projectId}/test-scenario/{testScenarioId} — 프로젝트 시나리오 단건 조회
    meta:
      id: req_orch_scenario_get_in_project
      created: 1784859830000
      modified: 1784859830000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: 프로젝트 스코프에서 시나리오 하나를 상세 조회한다.


