type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: orchestrator-server
meta:
  id: wrk_orch_artel_api_collection
  created: 1784859800000
  modified: 1786060800000
  description: |-
    Artel Orchestration Server API — 인증, 프로젝트, 기획서, 게임빌드·인스턴스, SDK·Agent·TestScenario.

    **두 개의 base URL을 쓴다**(ARTEL-265/266). 서버는 HTTP 체인을 둘 조립하고 포트로 가른다.

    - `stage_orch_base_url` — 공개 포트(8080). `/api/**`·`/oauth2/**`·`/ws/**`가 여기 산다. 리버스 프록시가 넘기는 유일한 포트다. 이 포트로 `/internal/...`을 부르면 **404**다 — 401이 아니라 404인 것은 "인증만 하면 있다"는 사실조차 흘리지 않기 위해서다.
    - `stage_orch_internal_base_url` — 내부 포트(기본 8081). 무인증 서버-투-서버 API(`/internal/**`) 전용이며, 이 포트로는 `/internal` **밖**이 전부 404다. 컨테이너에서 호스트로 게시하지 않으므로 인터넷에서는 존재하지 않는다.

    경로만 고치고 base URL을 그대로 두면 여전히 404이고, 원인이 경로인지 포트인지 응답만 봐서는 구분되지 않는다. `/internal/*` 요청이 404면 먼저 어느 변수를 쓰고 있는지 본다.

    배포된 내부 포트에 붙어야 하면 SSH 터널을 판다(`ssh -L 8081:localhost:8081 <host>`). 그러면 기본값 `http://localhost:8081` 그대로 맞는다.

    비밀값(JWT 등)은 이 파일에 넣지 말고 Insomnia private environment로 관리한다.
collection:
- name: Auth
  meta:
    id: fld_orch_auth
    created: 1784859800000
    modified: 1784859800000
  children:
  - url: '{{ _.stage_orch_base_url }}/oauth2/authorization/github'
    name: GET /oauth2/authorization/github — OAuth 로그인 시작
    meta:
      id: req_orch_oauth_start
      created: 1784859801000
      modified: 1784859801000
      isPrivate: false
      description: '**호출 주체**: 브라우저(FE) → Orchestration (Spring Security)


        **동작**: GitHub OAuth2 인가 페이지로 302 리다이렉트한다. 사용자가 GitHub에서 승인하면 콜백으로 돌아온다.


        **Request**

        - 없음


        **Response**

        - `302`: GitHub 인가 URL로 리다이렉트


        **활용**: 로그인 진입점. 최종적으로 콜백에서 `artel_access_token`(JWT) 쿠키를 발급받는다.'
    method: GET
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: '{{ _.stage_orch_base_url }}/login/oauth2/code/github'
    name: GET /login/oauth2/code/github — OAuth 콜백
    meta:
      id: req_orch_oauth_callback
      created: 1784859802000
      modified: 1784859802000
      isPrivate: false
      description: '**호출 주체**: GitHub → Orchestration


        **동작**: `code`·`state`로 GitHub 토큰을 교환해 사용자 프로필을 받고 app_user를 upsert한 뒤, `artel_access_token`(JWT) 쿠키를 심고 FE로 리다이렉트한다.


        **Request**

        - `code` (query): GitHub 인가 코드

        - `state` (query): CSRF 방지 state


        **Response**

        - `302`: FE로 리다이렉트 + `Set-Cookie: artel_access_token`


        **활용**: 이후 모든 인증 요청은 이 쿠키(또는 Bearer)로 이루어진다.'
    method: GET
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: '{{ _.stage_orch_base_url }}/api/auth/me'
    name: GET /api/auth/me — 내 정보 조회
    meta:
      id: req_orch_auth_me
      created: 1784859803000
      modified: 1784859803000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: 쿠키/Bearer의 JWT를 검증하고 현재 로그인 사용자 정보를 반환한다.


        **Request**

        - `artel_access_token` (cookie) 또는 `Authorization: Bearer <jwt>`


        **Response**

        - `200`: `{ userId, displayName, email, ... }`

        - `401`: 토큰 없음/만료


        **활용**: FE 초기 진입 시 세션 유효성 확인과 사용자 표시에 쓴다.'
    method: GET
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/auth/logout'
    name: POST /api/auth/logout — 로그아웃
    meta:
      id: req_orch_auth_logout
      created: 1784859804000
      modified: 1784859804000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: `artel_access_token` 쿠키를 만료시켜 삭제한다.


        **Request**

        - 없음(쿠키만)


        **Response**

        - `200`: 로그아웃 완료'
    method: POST
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
- name: Project
  meta:
    id: fld_orch_project
    created: 1784859801000
    modified: 1784859801000
  children:
  - url: '{{ _.stage_orch_base_url }}/api/projects'
    name: GET /api/projects — 프로젝트 목록 조회
    meta:
      id: req_orch_project_list
      created: 1784859805000
      modified: 1784859805000
      isPrivate: false
      description: '**호출 주체**: FE 대시보드 → Orchestration


        **동작**: 내가 멤버로 속한 프로젝트를 페이지네이션으로 조회한다. 각 항목에 최신 기획서/문서 수 등 요약을 포함한다(N+1 회피 위해 일괄 조회).


        **Request**

        - `page` (query, 선택): 0-base 페이지

        - `size` (query, 선택): 페이지 크기


        **Response**

        - `200`: `{ items: [ { id, name, genre, latestDocument?, documentCount, ... } ], page, size, total }`


        **활용**: 대시보드의 프로젝트 카드 목록을 그린다.'
    method: GET
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/projects'
    name: POST /api/projects — 프로젝트 등록
    meta:
      id: req_orch_project_create
      created: 1784859806000
      modified: 1784859806000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: 프로젝트를 생성하고 요청자를 OWNER 멤버로 등록한다.


        **Request**

        - `name` (string, 필수)

        - `genre` (string, 필수)

        - `description` (string, 선택)


        **Response**

        - `201`: `{ projectId }`


        **활용**: 반환된 `projectId`를 이후 기획서/시나리오/인스턴스 요청의 경로 키로 쓴다.'
    method: POST
    body:
      mimeType: application/json
      text: '{"name": "My Game", "description": "테스트 게임 프로젝트"}'
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/projects/{% prompt ''Project ID'', ''myProjectId'', ''Project ID'', '''', ''myProjectId'' %}'
    name: GET /api/projects/{projectId} — 프로젝트 단일 조회
    meta:
      id: req_orch_project_get
      created: 1784859807000
      modified: 1784859807000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: 멤버인 프로젝트 하나를 조회한다. 비멤버/미존재는 구분 없이 감춘다.


        **Request**

        - `projectId` (path)


        **Response**

        - `200`: 프로젝트 상세

        - `404`: 비참여자 또는 미존재'
    method: GET
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/projects/{% prompt ''Project ID'', ''myProjectId'', ''Project ID'', '''', ''myProjectId'' %}'
    name: PATCH /api/projects/{projectId} — 프로젝트 수정
    meta:
      id: req_orch_project_patch
      created: 1784859808000
      modified: 1784859808000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: 프로젝트 메타(name/description/genre)를 부분 수정한다.


        **Request**

        - `projectId` (path)

        - `{ name?, description?, genre? }`


        **Response**

        - `200`: 수정된 프로젝트

        - `404`: 비참여자/미존재'
    method: PATCH
    body:
      mimeType: application/json
      text: '{"name": "Renamed Project"}'
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/projects/{% prompt ''Project ID'', ''myProjectId'', ''Project ID'', '''', ''myProjectId'' %}'
    name: DELETE /api/projects/{projectId} — 프로젝트 삭제
    meta:
      id: req_orch_project_delete
      created: 1784859809000
      modified: 1784859809000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: 프로젝트를 soft delete(`deleted_at`)한다. 목록/조회에서 제외된다.


        **Request**

        - `projectId` (path)


        **Response**

        - `204`: 삭제 완료

        - `404`: 비참여자/미존재'
    method: DELETE
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
- name: Document (기획서)
  meta:
    id: fld_orch_document
    created: 1784859802000
    modified: 1784859802000
  children:
  - url: '{{ _.stage_orch_base_url }}/api/projects/{% prompt ''Project ID'', ''myProjectId'', ''Project ID'', '''', ''myProjectId'' %}/documents/upload-url'
    name: POST /api/projects/{projectId}/documents/upload-url — 기획서 업로드 URL 발급
    meta:
      id: req_orch_doc_upload
      created: 1784859810000
      modified: 1784859810000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: S3 presigned **PUT** URL을 발급한다. FE는 이 URL로 파일을 S3에 직접 올린다. PDF만 허용하며 object_key는 서버가 정한다.


        **Request**

        - `projectId` (path)

        - `fileName` (string, 필수)

        - `sizeBytes` (number, 필수)


        **Response**

        - `200`: `{ objectKey, url }` (url = presigned PUT)


        **활용**: S3 PUT 성공 후 `objectKey`로 업로드 확정(등록) 요청을 보낸다.'
    method: POST
    body:
      mimeType: application/json
      text: '{"fileName": "GDD_v1.pdf", "contentType": "application/pdf"}'
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/projects/{% prompt ''Project ID'', ''myProjectId'', ''Project ID'', '''', ''myProjectId'' %}/documents'
    name: POST /api/projects/{projectId}/documents — 기획서 업로드 확정(등록)
    meta:
      id: req_orch_doc_upload_confirm
      created: 1784859811000
      modified: 1784859811000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: S3에 올라간 객체를 HEAD로 검증(존재·PDF 매직·경로)하고 project_document 행을 만든다. 같은 프로젝트에 다시 올리면 교체가 아니라 version이 증가한다.


        **Request**

        - `projectId` (path)

        - `objectKey` (string, 필수): 업로드 URL 발급 때 받은 키


        **Response**

        - `201`: 등록된 문서 `{ id, version, fileName, parseStatus(PENDING), ... }`


        **활용**: 이 문서(id)가 추출(/extract) → knowledge 적재(source=DOCS, source_id=이 id)의 출처가 된다. 업로드 시 파일 hash 중복이면 409로 막히고 추출도 생략된다.'
    method: POST
    body:
      mimeType: application/json
      text: '{"fileName": "GDD_v1.pdf", "s3Key": "projects/1/documents/abc-123/GDD_v1.pdf"}'
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/projects/{% prompt ''Project ID'', ''myProjectId'', ''Project ID'', '''', ''myProjectId'' %}/documents'
    name: GET /api/projects/{projectId}/documents — 기획서 이력 조회
    meta:
      id: req_orch_doc_list
      created: 1784859812000
      modified: 1784859812000
      isPrivate: false
      description: '**호출 주체**: FE → Orchestration


        **동작**: 프로젝트의 기획서 버전을 최신순으로 나열한다.


        **Request**

        - `projectId` (path)


        **Response**

        - `200`: `[ { id, version, fileName, uploadedAt, uploadedBy, parseStatus }, ... ]`


        **참고**: `parseStatus`는 PENDING(업로드만) → EXTRACTING → EXTRACTED(knowledge 적재 완료) / FAILED.'
    method: GET
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
  - url: '{{ _.stage_orch_base_url }}/api/projects/{% prompt ''Project ID'', ''myProjectId'', ''Project ID'', '''', ''myProjectId'' %}/documents/{% prompt ''Document ID'', ''myDocId'', ''Document ID'', '''', ''myDocId'' %}/download-url'
    name: GET /api/projects/{projectId}/documents/{documentId}/download-url — 기획서 다운로드 URL 발급
    meta:
      id: req_orch_doc_download
      created: 1784859813000
      modified: 1784859813000
      isPrivate: false
      description: '**호출 주체**: FE, 그리고 추출 파이프라인 → Orchestration


        **동작**: 원본 PDF의 presigned **GET** URL(TTL 5분)을 발급한다.


        **Request**

        - `projectId`, `documentId` (path)


        **Response**

        - `200`: `{ url }` (presigned GET, 서명값 `X-Amz-Signature` 포함)


        **활용**: 같은 URL을 Agent `/extract`의 `source_url`로 넘긴다. 자격증명 없는 배포에선 서명 없는 URL이 나오므로 서명 유무를 확인한다.'
    method: GET
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    authentication:
      type: bearer
      token: '{{ _.stage_orch_jwt }}'
