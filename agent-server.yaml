  - url: "{{ _.stage_agent_base_url }}/extract"
    name: /extract — 기획서에서 game_context 추출
    meta:
      id: req_c7f077298de149d28c266bdd0a9b4357
      created: 1784719778638
      modified: 1784851200000
      isPrivate: false
      description: |-
        **호출 주체**: Orchestration → Agent Server (무상태, 세션 없음)

        **동작**: `source_url`을 httpx로 직접 GET해 문서 바이트를 받고, 확장자/Content-Type으로 로더를 골라(pdf는 pdfplumber, txt·md는 디코드) 평문으로 만든 뒤 LLM에 넘겨 구조화된 `game_context`를 뽑는다.

        **⚠️ source_url은 presigned GET URL이어야 한다.** Agent Server는 AWS 자격증명을 갖지 않고 익명 GET만 한다. 서명은 URL 쿼리스트링(`X-Amz-Signature` 등)에 들어 있고, S3는 그 서명을 만든 IAM 주체의 권한으로 접근을 허용한다. 서명이 없는 평문 S3 URL을 넣으면 버킷이 비공개이므로 `403 AccessDenied` → 이 API는 `502`로 감싼다. 운영에서는 Orchestration이 `/extract` 호출 직전에 발급한다.

        **테스트 준비**: presigned URL은 시한부 서명값이라 이 파일에 커밋하지 않는다. 아래로 발급해 개인 환경(private environment)의 `extract_source_url`에 넣는다.

        ```
        aws s3 presign "s3://<bucket>/<key>" --expires-in 3600 --region ap-northeast-2
        ```

        `filename`은 URL과 별개로 포맷 판별 힌트이므로, presign한 객체와 같은 확장자를 유지한다.

        **Request**
        - `source_url` (string, 필수): presigned GET URL
        - `filename` (string, 필수): 포맷 판별용 파일명. `.pdf` / `.txt` / `.md` 지원
        - `model` (enum, 선택): 기본 `openai/gpt-4o-mini`. `openai/gpt-4o`, `anthropic/claude-sonnet-5`, `anthropic/claude-opus-4.8`, `google/gemini-2.5-flash`, `google/gemini-2.5-pro`, `google/gemma-4-31b-it:free`

        **Response**
        - `200`: `{ filename, game_context }`. `game_context`는 `overview`, `screens`, `mechanics`, `entities`, `progression`, `flows`, `glossary`, `misc` 8개 섹션 고정
        - `415`: 지원하지 않는 포맷
        - `422`: 추출 결과가 스키마 검증 실패
        - `502`: 문서 fetch 실패(서명 없음·만료·크기 초과·타임아웃) 또는 LLM 오류

        **활용**: 반환된 `game_context`를 Orchestration이 저장하고, 이후 시나리오 세션의 `game_context` 입력으로 재사용한다. 원본 PDF는 S3에 남고 presigned URL은 저장하지 않는다.
      sortKey: -1784697066598.5
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "source_url": "{{ _.extract_source_url }}",
          "filename": "REPLACE_FILENAME.pdf",
          "model": "openai/gpt-4o-mini"
        }
    headers:
      - name: Content-Type
        value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.stage_agent_ws_url }}/sessions/{% response 'body',
      'req_7d5ab9224f184b338e9e2e7a12df2f3c', 'b64::JC5zZXNzaW9uX2lk::46b',
      'never', 60 %}"
    name: /sessions/{session_id} — 시나리오 스트림
    meta:
      id: ws-req_ddf5b310e09648fb92147dcde3e73631
      created: 1784682778201
      modified: 1784719085528
      description: |-
        시나리오 실시간 스트림 (WebSocket).

        [흐름]
        1) POST /sessions 로 session_id 획득 → 환경변수 session_id 설정
        2) 이 URL로 WS 연결 → 서버가 첫 turn 결과(result 이벤트) 전송
        3) 클라이언트가 turn 메시지 전송 → 서버가 result 응답

        [클라이언트 → 서버 (turn)]
        {
          "type": "turn",
          "user_input": "2단계를 더 구체적으로 바꿔줘",
          "draft": {
            "title": "로그인 실패 시나리오",
            "description": "잘못된 비밀번호 입력 흐름",
            "steps": [
              {"step": 1, "title": "로그인 화면 진입", "state": "앱 실행됨", "action": "로그인 버튼 탭", "expected": "로그인 폼 표시"}
            ]
          },
          "model": "openai/gpt-4o-mini"
        }
        (draft·model 선택. steps는 1부터 연속 번호)

        [서버 → 클라이언트]
        result: {"type":"result","message":"...","scenario":{"title":"...","description":"...","steps":[...]}}
        error : {"type":"error","code":"session_expired|bad_request|validation_error|llm_error","detail":"..."}
      sortKey: -1784682778201
    settings:
      encodeUrl: true
      cookies:
        store: true
        send: true
      followRedirects: global
