  created: 1784719753827
  modified: 1784719865193
  description: >-
    Artel Agent Server API — 시나리오 생성/QA 세션 및 기획서 game_context 추출
    엔드포인트.

    환경: Base Environment는 stage(https://stage-agent.artel.kr), local
    서브 환경은 http://localhost:8000. stage_agent_base_url /
    stage_agent_ws_url 두 변수를 사용한다. 비밀값은 이 파일에 넣지 말고
    Insomnia private environment로 관리한다.

    /extract는 `extract_source_url`(S3 presigned GET URL)을 참조하지만 이 파일은
    그 값을 정의하지 않는다. 서명이 담긴 시한부 자격증명이므로 각자 private
    environment에 채운다 — 요청 Docs 패널의 발급 커맨드 참고.
