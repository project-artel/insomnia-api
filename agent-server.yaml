type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: agent-server
meta:
  id: wrk_3b5acfc130bd41b088450cbe1090a668
  created: 1784719753827
  modified: 1786060800000
  description: >-
    Artel Agent Server API — 시나리오 생성/QA 세션, 기획서 game_context 추출,
    임베딩·knowledge 질의·모델 카탈로그 엔드포인트.

    경로 체계(ARTEL-270): 업무 엔드포인트는 전부 `/internal` 아래에 있다. 그
    접두사가 신뢰 경계다 — 아래는 Orchestration에서 오는 무인증 서버-투-서버
    트래픽이고, 밖은 아니다. `/health`만 접두사 없이 남는다(컨테이너·툴링
    표면이지 제품 API가 아니다).

    환경: Base Environment는 stage(https://stage-agent.artel.kr), local
    서브 환경은 http://localhost:8000. stage_agent_base_url /
    stage_agent_ws_url 두 변수를 사용하며, 둘 다 끝에 슬래시를 두지 않는다 —
    `…/`에 `/internal/embed`가 붙으면 `//internal/embed`가 되고 FastAPI는
    리다이렉트 없이 404를 낸다. 비밀값은 이 파일에 넣지 말고 Insomnia
    private environment로 관리한다.

    /extract의 `extract_source_url` 기본값은 공개해 둔 테스트 픽스처 하나를 가리키므로
    pull 직후 바로 실행된다. 다른 문서로 시험하려면 presigned URL을 private
    environment에 넣어 덮어쓴다 — 서명값은 이 파일에 커밋하지 않는다.
